plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.rustem.clappingcat'
version = '1.0.0'

base {
    archivesName = 'clappingcat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { clappingcat { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version: '1.20.1', forge_version: '47.2.0',
                             mod_id: 'clappingcat', mod_name: 'Clapping Cat',
                             mod_version: project.version, mod_authors: 'Rustem',
                             mod_description: 'A ridiculously strong meme boss: Clapping Cat.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// produce the final (reobfuscated) mod jar in build/libs
jar.finalizedBy('reobfJar')
